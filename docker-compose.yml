version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: traveloop
      POSTGRES_USER: traveloop_user
      POSTGRES_PASSWORD: traveloop_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://traveloop_user:traveloop_pass@db:5432/traveloop
      JWT_SECRET: your_super_secret_key_change_in_prod
      FRONTEND_ORIGIN: http://localhost:3000
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - db
    ports:
      - "5000:5000"
    command: sh -c "node src/db/migrate.js && node src/index.js"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
